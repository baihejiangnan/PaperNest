<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>PaperNest</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="app">
      <aside id="workspace-rail" aria-label="Workspace navigation">
        <button id="btn-sidebar" type="button" aria-label="Toggle sidebar" title="Toggle sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
        </button>
        <span class="rail-divider" aria-hidden="true"></span>
        <button id="rail-files" type="button" title="Files" aria-label="Files">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        </button>
        <button id="rail-search" type="button" title="Search files" aria-label="Search files">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
        </button>
        <button id="rail-outline" type="button" title="Outline" aria-label="Outline">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h2M9 5h11M4 12h2M9 12h11M4 19h2M9 19h11"/></svg>
        </button>
        <span class="rail-spacer"></span>
        <button id="btn-settings" data-i18n-title="toolbar.settings.title" data-i18n-aria="toolbar.settings.aria" title="Settings (Ctrl/Cmd+,)" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
        </button>
        <button id="btn-about" data-i18n-title="toolbar.about.title" data-i18n-aria="toolbar.about.title" title="About PaperNest" aria-label="About PaperNest">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 10v6"/><path d="M12 7h.01"/></svg>
          <span id="update-dot" aria-hidden="true" hidden></span>
        </button>
      </aside>
      <div id="workspace-layout">
        <aside id="workspace-sidebar" aria-label="Workspace" hidden>
          <div class="workspace-switcher">
            <button id="workspace-files-tab" class="active" type="button" aria-selected="true"></button>
            <button id="workspace-outline-tab" type="button" aria-selected="false"></button>
          </div>
          <div id="workspace-files-view">
            <div id="workspace-root-row">
              <button id="workspace-up" type="button" title="Parent folder">↑</button>
              <span class="workspace-folder-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2-2H5a2 2 0 0 1-2-2z"/></svg></span>
              <span id="workspace-root-name"></span>
              <button id="workspace-search-toggle" type="button" title="Search">⌕</button>
            </div>
            <input id="workspace-search" type="search" hidden />
            <div id="workspace-tree" role="tree"></div>
            <div id="workspace-search-results" hidden></div>
          </div>
          <div id="workspace-outline-view" hidden></div>
        </aside>
        <div id="document-pane">
          <header id="titlebar" data-tauri-drag-region>
            <nav id="tabs" aria-label="Open documents" data-tauri-drag-region hidden></nav>
            <div id="tab-toolbar">
              <button id="new-tab-button" type="button" data-i18n-title="tab.new" data-i18n-aria="tab.new" title="New tab" aria-label="New tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
              <button id="tab-list-button" type="button" data-i18n-title="tab.list" data-i18n-aria="tab.list" title="All tabs" aria-label="All tabs" aria-haspopup="menu" aria-controls="tab-list-menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
            </div>
            <span id="titlebar-grip" data-tauri-drag-region aria-hidden="true"></span>
            <div id="window-controls">
              <button id="window-minimize" type="button" data-i18n-title="toolbar.minimize" data-i18n-aria="toolbar.minimize" title="Minimize" aria-label="Minimize"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 12h14"/></svg></button>
              <button id="window-maximize" type="button" data-i18n-title="toolbar.maximize" data-i18n-aria="toolbar.maximize" title="Maximize" aria-label="Maximize"><svg class="maximize-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="5" width="14" height="14"/></svg><svg class="restore-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 5h11v11H8zM5 8H4v12h12v-1"/></svg></button>
              <button id="window-close" type="button" data-i18n-title="toolbar.closeWindow" data-i18n-aria="toolbar.closeWindow" title="Close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 6 18 18M18 6 6 18"/></svg></button>
            </div>
          </header>
          <div id="document-nav">
            <div class="document-nav-history">
              <button id="nav-back" type="button" data-i18n-title="toolbar.back" data-i18n-aria="toolbar.back" title="Back" aria-label="Back" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m14 5-7 7 7 7"/></svg></button>
              <button id="nav-forward" type="button" data-i18n-title="toolbar.forward" data-i18n-aria="toolbar.forward" title="Forward" aria-label="Forward" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m10 5 7 7-7 7"/></svg></button>
            </div>
            <span id="doc-title">Untitled</span>
            <input id="doc-title-input" type="text" hidden autocomplete="off" spellcheck="false" />
            <div id="actions">
          <button id="btn-save" data-i18n-title="toolbar.save.title" data-i18n-aria="toolbar.save.aria" title="Save (Ctrl/Cmd+S)" aria-label="Save">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>
          </button>
          <button id="btn-save-as" data-i18n-title="toolbar.saveAs.title" data-i18n-aria="toolbar.saveAs.aria" title="Save as (Ctrl/Cmd+Shift+S)" aria-label="Save as">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v5.5"/><path d="M7 3v5h8"/><path d="M7 21v-8h8v2"/><path d="m15.5 20.5 4.75-4.75 1.5 1.5L17 22h-1.5z"/></svg>
          </button>
          <button id="btn-export" data-i18n-title="toolbar.export.title" data-i18n-aria="toolbar.export.aria" title="Export HTML / PDF" aria-label="Export" aria-haspopup="menu" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h7"/><path d="M13 12h8"/><path d="m18 7 5 5-5 5"/></svg>
          </button>
          <button id="btn-source" data-i18n-title="toolbar.source.title" data-i18n-aria="toolbar.source.aria" title="Toggle source view" aria-label="Toggle source view">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 18l6-6-6-6"/><path d="M8 6l-6 6 6 6"/></svg>
          </button>
            </div>
          </div>
          <div id="new-tab-page" hidden>
            <div class="new-tab-actions">
              <button id="start-create" type="button" data-i18n="start.create">Create new file</button>
              <button id="start-open" type="button" data-i18n="start.open">Open file</button>
              <button id="start-close" type="button" data-i18n="start.close">Close tab</button>
            </div>
          </div>
          <main id="editor"></main>
          <div id="image-document" hidden><img id="image-document-content" alt="" draggable="false" /></div>
          <div id="source-shell" hidden><div id="source"></div></div>
        </div>
      </div>
      <div id="tab-tooltip" role="tooltip" hidden></div>
      <div id="tab-list-menu" role="menu" hidden></div>
      <div id="workspace-menu" role="menu" hidden></div>
      <div id="workspace-prompt" hidden>
        <div class="workspace-prompt-card" role="dialog" aria-modal="true" aria-labelledby="workspace-prompt-label">
          <label id="workspace-prompt-label" for="workspace-prompt-input"></label>
          <input id="workspace-prompt-input" type="text" />
          <div class="workspace-prompt-actions">
            <button id="workspace-prompt-cancel" type="button"></button>
            <button id="workspace-prompt-ok" type="button"></button>
          </div>
        </div>
      </div>
      <div id="text-stats" aria-live="polite" hidden></div>
      <div id="settings-hint" hidden></div>
      <div id="export-menu" role="menu" hidden>
        <button type="button" role="menuitem" data-act="html" data-i18n="menu.exportHtml">Export HTML</button>
        <button type="button" role="menuitem" data-act="pdf" data-i18n="menu.exportPdf">Export PDF</button>
      </div>
      <div id="about" hidden>
        <div class="about-card" role="dialog" aria-modal="true" aria-labelledby="about-title">
          <button class="about-close" data-i18n-aria="about.close" aria-label="Close">&times;</button>
          <img class="about-logo" src="/app-icon.png" alt="" />
          <h2 id="about-title">PaperNest <span id="about-version"></span></h2>
          <p class="about-tag" data-i18n="about.tagline">Portable WYSIWYG Markdown editor</p>
          <p class="about-meta" data-i18n="about.credit">baihejiangnan &middot; MIT License</p>
          <p><a id="about-link" href="https://github.com/baihejiangnan/PaperNest">github.com/baihejiangnan/PaperNest</a></p>
          <p class="about-fork"><span data-i18n="about.forkedFrom">Based on</span> <a id="about-upstream-link" href="https://github.com/zakee039/MDmeow">zakee039 / MDmeow</a></p>
          <section class="about-update" aria-live="polite">
            <button id="about-check-update" class="about-update-primary" type="button" data-i18n="update.check">Check for updates</button>
            <div id="about-update-status" class="about-update-status" hidden></div>
            <div id="about-update-notes" class="about-update-notes" hidden></div>
            <div id="about-update-progress" class="about-update-progress" hidden>
              <div class="about-update-progress-track"><div id="about-update-progress-bar"></div></div>
              <span id="about-update-progress-text">0%</span>
            </div>
            <div id="about-update-actions" class="about-update-actions" hidden>
              <button id="about-update-secondary" type="button" class="about-update-secondary"></button>
              <button id="about-update-primary-action" type="button" class="about-update-primary"></button>
            </div>
          </section>
          <p class="about-path" id="about-settings-path"></p>
        </div>
      </div>
      <div id="miku-easter" hidden>
        <img
          id="miku-easter-image"
          src="/miku-easter-egg.jpg"
          alt="Miku"
          draggable="false"
        />
      </div>
    </div>
  </body>
</html>
