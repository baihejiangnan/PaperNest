name: ci

# Everyday checks for pushes and pull requests. Releases are handled by
# release.yml; this workflow builds nothing for distribution and needs no secrets.

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      verify_public_updater:
        description: "Download and verify the published Windows update packages"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Type-check and build frontend
        run: pnpm build

      - name: Frontend logic tests
        run: |
          pnpm test:code-text
          pnpm test:tab-path
          pnpm test:details-html
          pnpm test:markdown-serializer
          pnpm test:update-ui
          pnpm test:document-sync
          pnpm test:release-unix

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib

      - name: Verify published updater downloads
        if: github.event_name == 'workflow_dispatch' && inputs.verify_public_updater
        shell: pwsh
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib update::tests::public_metadata_downloads_and_verifies_both_windows_packages -- --ignored --nocapture 2>&1 | Tee-Object -FilePath public-updater.log
          if ($LASTEXITCODE -ne 0) { throw 'Public updater verification failed.' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          foreach ($mode in @('installed', 'portable')) {
            if (-not (Select-String -LiteralPath public-updater.log -SimpleMatch "PASS: $version $mode public metadata, download, signature and tamper rejection")) {
              throw "Missing verification result for $version $mode"
            }
          }
