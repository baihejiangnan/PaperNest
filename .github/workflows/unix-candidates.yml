name: macOS and Linux candidates

# Manual preparation only. Does not create tags or publish GitHub Releases.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Committed source tag or SHA to build (empty uses workflow ref)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: unix-candidates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.platform }} candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-22.04
            output: linux-x86_64
          - platform: macos
            runner: macos-15
            output: macos-universal
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref != '' && inputs.source_ref || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: macOS Universal Rust targets
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Linux build and packaging dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential curl wget file libwebkit2gtk-4.1-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf rpm libfuse2 xdg-utils xvfb xdotool dbus-x11

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - run: pnpm install --frozen-lockfile

      - name: Script and frontend logic tests
        run: pnpm run '/^test:/'

      - name: Build candidate (includes frontend type check and build)
        run: pnpm release:${{ matrix.platform }}

      # generate_context! needs frontendDist, which the build above creates.
      - name: Native Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib

      - name: Linux desktop startup smoke check
        if: matrix.platform == 'linux'
        shell: bash
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          NO_AT_BRIDGE: "1"
        run: |
          dbus-run-session -- xvfb-run -a bash -euo pipefail <<'SMOKE'
          src-tauri/target/release/PaperNest > linux-startup.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            kill -0 "$app_pid" || { cat linux-startup.log; exit 1; }
            if xdotool search --onlyvisible --name PaperNest >/dev/null 2>&1; then
              echo "PASS: Linux packaged binary created a visible desktop window"
              exit 0
            fi
            sleep 1
          done
          cat linux-startup.log
          echo "::error::No visible PaperNest window within 30 seconds"
          exit 1
          SMOKE

      - name: Verify candidate checksums
        working-directory: release-unix/${{ matrix.output }}
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "macos" ]]; then
            shasum -a 256 -c SHA256SUMS.txt
          else
            sha256sum --check SHA256SUMS.txt
          fi

      - name: Verify macOS architectures and ad-hoc signature
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/PaperNest.app"
          lipo "$app/Contents/MacOS/PaperNest" -verify_arch x86_64 arm64
          codesign --verify --deep --strict --verbose=2 "$app"

      - uses: actions/upload-artifact@v4
        with:
          name: PaperNest-${{ matrix.output }}-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-unix/${{ matrix.output }}/*
          if-no-files-found: error
          retention-days: 14
